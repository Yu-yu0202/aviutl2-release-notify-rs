[package]
name = "aviutl2-release-notify-rs"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 4
strip = true

[dependencies]
anyhow = "1.0.103"
async_zip = { version = "0.0.18", features = ["tokio", "deflate", "tokio-fs"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
dotenvy = "0.15.7"
envy = "0.4.2"
futures-util = { version = "0.3.32", features = ["tokio-io"] }
quicord-rs = { version = "0.3.2", features = ["macros"] }
fancy-regex = "0.18.0"
regex = "1.13.0"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
scraper = "0.27.0"
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-native-tls", "postgres", "macros", "uuid", "chrono"] }
tempfile = "3.27.0"
tokio = "1.52.3"
tokio-cron-scheduler = "0.15.1"
tokio-util = { version = "0.7.18", features = ["compat"] }
twilight-http = "0.17.1"
twilight-model = "0.17.1"
twilight-util = { version = "0.17.0", features = ["builder"] }
uuid = { version = "1.23.4", features = ["serde", "v7", "zerocopy"] }
